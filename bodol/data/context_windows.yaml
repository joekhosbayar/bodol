# Input context window, in tokens. Data, not code — same reasoning as
# pricing.yaml: a new model is a data change, not a release.
#
# VERIFY BEFORE TRUSTING. Windows change between model generations:
#   gemini    https://ai.google.dev/gemini-api/docs/models
#   openai    https://platform.openai.com/docs/models
#   anthropic https://platform.claude.com/docs/en/about-claude/models
#
# A `null` window means UNKNOWN, not unlimited. `context.windows.policy_for`
# returns None for it, so compaction stays off rather than being sized from a
# guess — the same choice cost_usd makes for an unpriced model.
#
# Keys are the undated model id; telemetry.events.pricing_key strips Anthropic's
# date suffix before lookup.
#
# These are the *input* windows. Output caps are separate and much smaller; the
# agent's per-call output cap lives in Limits.max_tokens_per_call.

gemini:
  # TODO: unverified. Captured in tests/fixtures/toolcalls/gemini_weather_*.json.
  gemini-3.6-flash: null

  gemini-2.0-flash: 1048576
  gemini-2.5-flash: 1048576
  gemini-2.5-pro: 1048576

openai:
  # TODO: unverified. Captured in tests/fixtures/toolcalls/openai_weather_*.json.
  gpt-5.6-luna: null

anthropic:
  claude-haiku-4-5: 200000

  # TODO: unverified.
  claude-opus-5: null
  claude-sonnet-5: null
