# USD per 1M tokens. Data, not code — so old traces can be re-costed and new
# models added without a release.
#
# VERIFY BEFORE TRUSTING. These change, and paid/free tiers differ:
#   gemini    https://ai.google.dev/gemini-api/docs/pricing
#   openai    https://platform.openai.com/docs/pricing
#   anthropic https://platform.claude.com/docs/en/about-claude/pricing
# Rates below were read from those pages on 2026-08-25.
#
# Keys are the undated model id. Anthropic returns a dated one
# (claude-haiku-4-5-20251001); telemetry.events.pricing_key strips the suffix.
#
# A model with `input` or `output` null is UNPRICED: cost_usd is emitted as null
# in the trace rather than a misleading zero. Null NEVER means free — it means
# not published here.
#
# ---------------------------------------------------------------- cache keys
#
# Cached input is not one rate, it is up to four. A token is billed as exactly
# one of:
#
#   input             fresh, uncached
#   cached_input      served from cache — the READ / hit / refresh rate
#   cache_write       written to cache at the vendor's default TTL
#                     (Anthropic: 5 minutes. OpenAI: its single published rate.)
#   cache_write_1h    written to a 1-hour cache, where the vendor sells one
#
#   cache_storage_per_hour   USD per 1M tokens per HOUR of residency
#
# Only `input`, `output`, and `cached_input` are read by the code today:
# telemetry.events.Rates has three fields, and cost_usd splits input_tokens into
# cached and uncached. The write keys are inert — the loader picks fields off
# each mapping by name and ignores the rest. They are filled in now so that
# turning caching on later is a code change against complete data, not a
# scramble to backfill five rate cards under time pressure.
#
# To finish the job later:
#   1. Rates gains cache_write / cache_write_1h.
#   2. Usage gains cache_write_tokens and cache_write_1h_tokens, as further
#      SUBSETS of input_tokens — the same containment convention
#      reasoning_tokens already uses inside output_tokens. See base.py.
#   3. anthropic.py reads usage.cache_creation.ephemeral_5m_input_tokens and
#      .ephemeral_1h_input_tokens, falling back to the flat
#      cache_creation_input_tokens as 5m when the breakdown is absent. It
#      currently folds that field into input_tokens and discards the split,
#      which prices a write at 1.0x instead of 1.25x or 2x.
#   4. cost_usd bills four buckets, with
#      uncached = input - cached - write - write_1h.
#
# cache_storage_per_hour cannot be attributed to a call at all: it accrues on
# wall-clock residency, not on any request. It is recorded here for completeness
# and belongs in a separate ledger keyed on cache lifetime, never in a call
# record.
#
# ---------------------------------------------------------------- not modelled
#
# One flat rate per model per token class. These multipliers are real and are
# NOT applied anywhere:
#   - Batch API: 50% off both directions (all three vendors).
#   - Long-context tiers: OpenAI publishes a second, higher column for long
#     context; Gemini has done the same on earlier Pro models. A flat rate
#     under-reports long runs.
#   - OpenAI Fast mode / Flex, Anthropic fast mode: separate rate cards.
#   - Data residency: Anthropic and OpenAI both charge 1.1x for US-pinned
#     inference, on every token class including cache writes and reads.
#   - Effective dates: Gemini's 3.x Flash rates below DOUBLE on 2027-01-01.
#     There is no effective-date support here, so this file will need editing
#     on that date.

gemini:
  # Standard tier, paid. Output price includes thinking tokens, which matches
  # the adapter: it folds total_thought_tokens into output_tokens.
  # Context caching is a read discount plus hourly storage; no write premium is
  # published, so cache_write is null (unknown), not zero.
  # WARNING: input/output/cached_input all double on 2027-01-01.
  gemini-3.7-flash:
    input: 0.75
    output: 3.75
    cached_input: 0.075
    cache_write: null
    cache_write_1h: null
    cache_storage_per_hour: 0.50

  # Captured in tests/fixtures/toolcalls/gemini_weather_*.json.
  gemini-3.6-flash:
    input: 0.75
    output: 3.75
    cached_input: 0.075
    cache_write: null
    cache_write_1h: null
    cache_storage_per_hour: 0.50

openai:
  # Standard tier, SHORT context. The long-context column is roughly 2x on
  # every class (0.40 / 0.04 / 0.50 / 1.80) and is not modelled.
  # OpenAI publishes an explicit cache-write rate at 1.25x input, the same
  # multiplier as Anthropic's 5-minute tier. There is no TTL to choose, so
  # cache_write_1h does not exist here.
  # Captured in tests/fixtures/toolcalls/openai_weather_*.json.
  gpt-5.6-luna:
    input: 0.20
    output: 1.20
    cached_input: 0.02
    cache_write: 0.25
    cache_write_1h: null
    cache_storage_per_hour: null

anthropic:
  # Write premiums are exactly 1.25x (5m) and 2x (1h) of base input on every
  # model; reads are 0.1x. Written out in absolute terms anyway, because a
  # multiplier column would bake an Anthropic-shaped assumption into a
  # vendor-neutral table.
  # Anthropic has no cache storage fee; residency is covered by the write.
  claude-haiku-4-5:
    input: 1.00
    output: 5.00
    cached_input: 0.10
    cache_write: 1.25
    cache_write_1h: 2.00
    cache_storage_per_hour: null

  claude-sonnet-5:
    input: 2.00
    output: 10.00
    cached_input: 0.20
    cache_write: 2.50
    cache_write_1h: 4.00
    cache_storage_per_hour: null

  # Captured in tests/fixtures/toolcalls/claude_weather_1_opus.json.
  claude-opus-5:
    input: 5.00
    output: 25.00
    cached_input: 0.50
    cache_write: 6.25
    cache_write_1h: 10.00
    cache_storage_per_hour: null
