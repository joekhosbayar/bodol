[project]
name = "bodol"
version = "0.1.0"
description = "A model-agnostic AI agent framework built from scratch"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "google-genai>=1.0.0",
    "typer>=0.15.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[project.scripts]
bodol = "bodol.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.9",
    "mypy>=1.14",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bodol"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.13"
strict = true
# Provider SDKs ship partial stubs; don't let them block your own type checking.
[[tool.mypy.overrides]]
module = ["google.genai.*"]
ignore_missing_imports = true
